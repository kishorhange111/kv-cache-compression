[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-cache-compression"
version = "0.1.0"
description = "KV-cache compression from scratch on GPT-2: sliding window, StreamingLLM attention sinks, H2O heavy hitters, TOVA and KIVI-style low-bit quantisation, measured on perplexity, long-range copying and memory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
dependencies = ["torch>=2.2", "numpy>=1.26", "transformers>=4.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "E731"]
